<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact</title>
<meta name="description" content="Get in touch for orders, custom prints and wholesale. Based in Lahore, delivering across Pakistan.">
<meta name="theme-color" content="#09090A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2309090A'/%3E%3Cpath d='M9 24 21 8' stroke='%23FF2E2E' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<script src="js/config.js"></script>
<script src="js/boot.js"></script>

<main id="main">
  <div id="contactHead"></div>
  <div class="wrap contact-grid">
    <div>
      <h2 class="co-h">Send us a message</h2>
      <form id="contactForm" novalidate>
        <div class="row2">
          <div class="field"><label for="cName">Full name</label><input id="cName" name="name" autocomplete="name" required><div class="em">Please enter your name.</div></div>
          <div class="field"><label for="cEmail">Email</label><input id="cEmail" name="email" type="email" autocomplete="email" required><div class="em">Enter a valid email address.</div></div>
        </div>
        <div class="row2">
          <div class="field"><label for="cPhone">Phone / WhatsApp</label><input id="cPhone" name="phone" type="tel" autocomplete="tel" placeholder="03XX XXXXXXX"></div>
          <div class="field"><label for="cTopic">Topic</label><select id="cTopic" name="topic"><option value="order">Order help</option><option value="custom">Custom print</option><option value="wholesale">Wholesale</option><option value="other">Something else</option></select></div>
        </div>
        <div class="field"><label for="cMsg">Message</label><textarea id="cMsg" name="msg" required></textarea><div class="em">Tell us a little more (10+ characters).</div></div>
        <button class="btn btn-red" type="submit" data-magnetic>Send message <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 12h17M14 6l6 6-6 6"/></svg></button>
      </form>
    </div>
    <aside>
      <div class="info-c"><small>Email</small><a data-contact="email" href="#"></a></div>
      <div class="info-c"><small>Phone / WhatsApp</small><a data-contact="phone" href="#"></a></div>
      <div class="info-c"><small>Studio</small><p data-cfg="address"></p></div>
      <div class="info-c"><small>Hours</small><p>Mon–Sat · 10am–8pm</p></div>
      <div class="map" role="img" aria-label="Studio location marker"><span>Lahore, PK</span></div>
    </aside>
  </div>
  <section class="sec" id="faq" style="padding-top:0"><div class="wrap">
    <div class="sec-head" style="justify-content:center;text-align:center"><div><span class="eyebrow" data-reveal>Good to know</span><h2 class="display h-lg" data-split>FAQ</h2></div></div>
    <div class="faq" id="faqList"></div>
  </div></section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
